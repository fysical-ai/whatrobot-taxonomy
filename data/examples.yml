# whatrobot taxonomy — classification test set (docs/design.md §6)
# Source of truth. Licence: CC BY 4.0.
#
# Each entry is a product described by HARDWARE FACTS only. CI runs the tie-break rules
# (whatrobot_taxonomy/classify.py) over `facts` and asserts the result equals `expected`.
# `attributes` are illustrative examples of attribute values and are NOT verified product data;
# facts, specs and prices will be confirmed with dated sources before the first stable release.
#
# Robot facts:   is_kit, worn_on_body, humanoid_form, legs, wheels_or_tracks (none|wheels|tracks),
#                medium (ground|air|water), aerial_lift (multirotor|fixed-wing|hybrid-vtol),
#                aquatic_mode (rov|auv|usv), integrated_arm, manipulates, fixed_base,
#                arm_kinematics (articulated|scara|parallel|cartesian|cylindrical)
# Component facts: component_kind (end-effector|actuator|sensor|compute|power|structure|teleoperation)
#                plus per-kind facts documented in classify.py.
---
- handle: universal-robots-ur5e
  name: Universal Robots UR5e
  expected: rb-1-1
  facts: {fixed_base: true, manipulates: true, arm_kinematics: articulated}
  attributes: {collaborative: true, segment: [professional, research], application: [handling, machine-tending]}

