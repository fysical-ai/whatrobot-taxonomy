# whatrobot → IFR industrial robot type class (mechanical structure).
# Codes 10 (articulated), 20 (cartesian/linear/gantry), 30 (SCARA) confirmed from IFR WR 2022 Service Robots ch.1 footnote 13 (2026-10-27).
# Codes 40 (parallel), 50 (cylindrical), 90 (others) follow the same numbering pattern and are not yet verified against WR Industrial Robots ch.1.7 (tracked in README › Status).
---
scope: [rb]   # IFR industrial classes apply to robots only; components are out of scope
rules:
  - input: {category_id: rb-1-1}
    output: {category_id: ["10"]}
  - input: {category_id: rb-1-4}
    output: {category_id: ["20"]}
  - input: {category_id: rb-1-2}
    output: {category_id: ["30"]}
  - input: {category_id: rb-1-3}
    output: {category_id: ["40"]}
  - input: {category_id: rb-1-5}
    output: {category_id: ["50"]}
  - input: {category_id: rb-1}
    output: {category_id: ["90"]}
unmapped_category_ids:
  - rb
  - rb-2
  - rb-2-1
  - rb-2-2
  - rb-2-3
  - rb-3
  - rb-3-1
  - rb-3-2
  - rb-3-3
  - rb-4
  - rb-4-1
  - rb-4-2
  - rb-5
  - rb-6
  - rb-6-1
  - rb-6-2
  - rb-6-3
  - rb-7
  - rb-7-1
  - rb-7-2
  - rb-7-3
  - rb-8
  - rb-8-1
  - rb-9
  - rb-10
