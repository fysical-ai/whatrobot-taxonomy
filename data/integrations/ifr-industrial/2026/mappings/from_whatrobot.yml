# whatrobot → IFR industrial robot type class (mechanical structure).
# Codes verified against World Robotics 2022 – Service Robots ch.1 footnote 13 (retrieved 2026-10-28).
# Scope: robots only; IFR type classes apply to industrial-kinematics arms. rb-1 (the arm branch itself) is
# unmapped because a type class needs the kinematics decided.
---
scope: [rb]
rules:
  - input: {category_id: rb-1-1}
    output: {category_id: ["10"]}
  - input: {category_id: rb-1-4}
    output: {category_id: ["20"]}
  - input: {category_id: rb-1-5}
    output: {category_id: ["30"]}
  - input: {category_id: rb-1-3}
    output: {category_id: ["40"]}
  - input: {category_id: rb-1-2}
    output: {category_id: ["50"]}
unmapped_category_ids:
  - rb
  - rb-1
  - rb-2
  - rb-2-1
  - rb-2-2
  - rb-2-3
  - rb-3
  - rb-3-1
  - rb-3-2
  - rb-3-3
  - rb-4
  - rb-4-1
  - rb-4-2
  - rb-5
  - rb-6
  - rb-6-1
  - rb-6-2
  - rb-6-3
  - rb-7
  - rb-7-1
  - rb-7-2
  - rb-7-3
  - rb-8
  - rb-8-1
  - rb-8-2
  - rb-9
  - rb-10
