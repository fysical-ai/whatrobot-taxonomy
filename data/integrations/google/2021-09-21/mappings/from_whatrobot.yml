# whatrobot category → Google product taxonomy (2021-09-21), closest fit.
# Every target id verified against Shopify/product-taxonomy's vendored copy of Google's full_names
# (data/integrations/google/2021-09-21/full_names.yml, retrieved 2026-10-28), which is Google's
# taxonomy-with-ids.en-US.txt. Google has no robot-specific categories apart from Robotic Mowers,
# Robotic Toys and Remote Control Robots, so most robots map to the category a shop would file
# them under today. Comments give the Google path.
#
# Rule of thumb: branch nodes map to the same target as the leaf a shop would most often use, so that
# a product classified only to branch level still gets a usable Google category.
---
rules:
  # ---- arms: industrial manufacturing equipment
  - input: {category_id: rb-1}
    output: {category_id: ["1470"]}        # Business & Industrial > Manufacturing
  - input: {category_id: rb-1-1}
    output: {category_id: ["1470"]}
  - input: {category_id: rb-1-2}
    output: {category_id: ["1470"]}
  - input: {category_id: rb-1-3}
    output: {category_id: ["1470"]}
  - input: {category_id: rb-1-4}
    output: {category_id: ["1470"]}
  - input: {category_id: rb-1-5}
    output: {category_id: ["1470"]}
  # ---- humanoids and legged: no Google category; general industrial/commercial equipment
  - input: {category_id: rb-2}
    output: {category_id: ["111"]}         # Business & Industrial
  - input: {category_id: rb-2-1}
    output: {category_id: ["111"]}
  - input: {category_id: rb-2-2}
    output: {category_id: ["111"]}
  - input: {category_id: rb-2-3}
    output: {category_id: ["111"]}
  - input: {category_id: rb-3}
    output: {category_id: ["111"]}
  - input: {category_id: rb-3-1}
    output: {category_id: ["111"]}
  - input: {category_id: rb-3-2}
    output: {category_id: ["111"]}
  - input: {category_id: rb-3-3}
    output: {category_id: ["3625"]}        # Toys & Games > Toys > Robotic Toys (hexapods are mostly hobby kits)
  # ---- ground: material handling (AMR/AGV) — consumer cleaning/mowing robots are attribute-driven,
  #      so a shop should override with 619 (Vacuums) / 6788 (Robotic Mowers) / 2997 (Pool Sweeps) by application
  - input: {category_id: rb-4}
    output: {category_id: ["6987"]}        # Business & Industrial > Material Handling
  - input: {category_id: rb-4-1}
    output: {category_id: ["6987"]}
  - input: {category_id: rb-4-2}
    output: {category_id: ["6987"]}
  - input: {category_id: rb-5}
    output: {category_id: ["6987"]}
  # ---- aerial
  - input: {category_id: rb-6}
    output: {category_id: ["3395"]}        # Vehicles & Parts > Vehicles > Aircraft
  - input: {category_id: rb-6-1}
    output: {category_id: ["3395"]}
  - input: {category_id: rb-6-2}
    output: {category_id: ["3395"]}
  - input: {category_id: rb-6-3}
    output: {category_id: ["3395"]}
  # ---- aquatic
  - input: {category_id: rb-7}
    output: {category_id: ["3540"]}        # Vehicles & Parts > Vehicles > Watercraft
  - input: {category_id: rb-7-1}
    output: {category_id: ["3540"]}
  - input: {category_id: rb-7-2}
    output: {category_id: ["3540"]}
  - input: {category_id: rb-7-3}
    output: {category_id: ["3540"]}
  # ---- wearable
  - input: {category_id: rb-8}
    output: {category_id: ["520"]}         # Health & Beauty > Health Care > Mobility & Accessibility > Accessibility Equipment
  - input: {category_id: rb-8-1}
    output: {category_id: ["520"]}
  - input: {category_id: rb-8-2}
    output: {category_id: ["520"]}
  # ---- stationary companions and kits
  - input: {category_id: rb-9}
    output: {category_id: ["3625"]}        # Toys & Games > Toys > Robotic Toys
  - input: {category_id: rb-10}
    output: {category_id: ["3500"]}        # Toys & Games > Toys > Educational Toys > Science & Exploration Sets
  # ---- components
  - input: {category_id: cp}
    output: {category_id: ["1801"]}        # Electronics > Components
  - input: {category_id: cp-1}
    output: {category_id: ["1470"]}        # Manufacturing (end-effectors are industrial tooling)
  - input: {category_id: cp-1-1}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-1-1}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-1-2}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-1-3}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-1-4}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-2}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-3}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-1-4}
    output: {category_id: ["1470"]}
  - input: {category_id: cp-2}
    output: {category_id: ["7275"]}        # Hardware > Power & Electrical Supplies > Electrical Motors
  - input: {category_id: cp-2-1}
    output: {category_id: ["7275"]}
  - input: {category_id: cp-2-2}
    output: {category_id: ["7275"]}
  - input: {category_id: cp-2-3}
    output: {category_id: ["7275"]}
  - input: {category_id: cp-2-4}
    output: {category_id: ["7275"]}
  - input: {category_id: cp-2-5}
    output: {category_id: ["7275"]}
  - input: {category_id: cp-3}
    output: {category_id: ["1801"]}        # Electronics > Components
  - input: {category_id: cp-3-1}
    output: {category_id: ["312"]}         # Cameras & Optics > Cameras > Webcams (closest for machine-vision/depth cameras)
  - input: {category_id: cp-3-2}
    output: {category_id: ["1305"]}        # Hardware > Tools > Measuring Tools & Sensors
  - input: {category_id: cp-3-3}
    output: {category_id: ["1801"]}
  - input: {category_id: cp-3-4}
    output: {category_id: ["1801"]}
  - input: {category_id: cp-3-5}
    output: {category_id: ["7395"]}        # Electronics > Components > Accelerometers
  - input: {category_id: cp-3-6}
    output: {category_id: ["1801"]}        # Electronics > Components (no GNSS/radar component category in Google)
  - input: {category_id: cp-4}
    output: {category_id: ["3416"]}        # Electronics > Circuit Boards & Components > Printed Circuit Boards > Development Boards
  - input: {category_id: cp-5}
    output: {category_id: ["276"]}         # Electronics > Electronics Accessories > Power > Batteries
  - input: {category_id: cp-6}
    output: {category_id: ["1470"]}        # Manufacturing (mounts, flanges)
  - input: {category_id: cp-7}
    output: {category_id: ["499950"]}      # Electronics > ... > Input Devices > Gesture Control Input Devices
unmapped_category_ids:
  - rb                                     # root — a product is never classified only to root
