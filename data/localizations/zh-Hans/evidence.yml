category.cp-3-3:
  term: 力/力矩传感器
  status: confirmed
  also: [六维力传感器, 六轴力传感器, 六维力/力矩传感器]
  sources:
    - https://schunk.com/cn/zh/zi-dong-hua-ji-shu/li-jue/torukusensa/ft/c/PGR_1680
    - https://www.worldrobotconference.com/profile/robot/download/2025/06/26/2025 Force Sensor Product catalog_20250626104353A040.pdf
    - https://damodev.csdn.net/6a438676662f9a54cb86dc40.html
  note: Schunk's Chinese site writes 6 轴力/力矩传感器. Chinese makers (宇立, 柯力) call their products 六维力传感器 or 六轴力传感器. DeepL and Google both gave 力矩传感器, which drops the force half.
