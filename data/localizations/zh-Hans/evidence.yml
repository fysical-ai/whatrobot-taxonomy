attribute.stall_torque:
  term: 堵转扭矩
  status: open
  also: [最大扭矩]
  sources:
    - https://www.mouser.com/datasheet/2/813/FS5106B_specs-2488602.pdf
    - https://docs.sunfounder.com/projects/galaxy-rvr/zh-cn/latest/hardware/cpn_servo.html
  note: Servo sheets use 堵转 for stall (堵转电流, stall current), so 堵转扭矩 is consistent, but the torque label itself was seen as 最大扭矩. Needs a servo maker page that prints 堵转扭矩.
