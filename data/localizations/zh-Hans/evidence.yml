# whatrobot taxonomy — zh-Hans term evidence
# Licence: CC BY 4.0. Not loaded by the taxonomy tooling; a record of where each Chinese term was seen.
# Keys: attribute.<key>, value.<key>, category.<id>, matching attributes.yml, values.yml and categories.yml.
# status: confirmed (term seen on the sources) | changed (draft replaced on this evidence) | open (needs a decision).
# Sources are manufacturer catalogues and datasheets, standards drafts, journals and trade articles in Chinese,
# read 2026-11-18. They are evidence of usage only: no text is copied from them and no specifications are taken
# from them. Terms without an entry have not been checked yet.
---
attribute.payload:
  term: 负载
  status: confirmed
  also: [有效负载]
  sources:
    - https://www.worldrobotconference.com/profile/robot/download/2025/07/03/KUKA选型手册-中文_20250703164527A701.pdf
    - https://damodev.csdn.net/6ae20d7be5f4ca4eff8cf61c.html
attribute.reach:
  term: 臂展
  status: confirmed
  also: [工作半径, 可达半径]
  sources:
    - https://www.worldrobotconference.com/profile/robot/download/2025/07/03/KUKA选型手册-中文_20250703164527A701.pdf
    - https://damodev.csdn.net/6ae20d7be5f4ca4eff8cf61c.html
    - https://fanuc.co.jp/en/product/catalog/pdf/robot/RCRALL(C)-06.pdf
  note: 臂展 in KUKA's Chinese selection guide; 工作半径 in a selection article; 可达半径 in FANUC's Chinese catalogue.
attribute.repeatability:
