attribute.mass:
  term: 重量
  status: changed
  was: 质量
  also: [自重]
  sources:
    - https://www.pololu.com:443/file/0J1270/FS5115M-specs.pdf
    - https://a.storyblok.com/f/298593/x/6f8ff5a6f5/z-efg-8s-_v-2022-03-25.pdf
    - https://www.worldrobotconference.com/profile/robot/download/2025/07/03/KUKA选型手册-中文_20250703164527A701.pdf
  note: Datasheets label it 重量 (FEETECH servos, an electric gripper) or 自重 (KUKA). 质量 is the physics term and was not seen as a spec label.
