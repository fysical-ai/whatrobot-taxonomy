category.cp-1-1-2:
  term: 真空夹爪
  status: changed
  was: 真空吸盘
  also: [真空夹持器, 真空吸附单元, 真空吸盘]
  sources:
    - https://www.smcworld.com/webcatalog/zh-cn/vacuum-equipment/gripper-unit-for-collaborative-robots
    - https://onrobot.com/zh/chanpin/vg10diandongzhenkongjiachiqi
  note: 真空吸盘 is the suction cup. SMC's Chinese catalogue calls the gripper 真空夹爪 or 真空吸附单元 and lists 吸盘 as a part of it; OnRobot calls the gripper 真空夹持器. 真空夹爪 also matches the sibling names (手指式夹爪, 磁力夹爪).
