attribute.stall_torque:
  term: Blockiermoment
  status: open
  also: [Blockierdrehmoment, Stellkraft, Stillstandsmoment]
  sources:
    - https://lindinger.at/de/RC-Elektronik/Servos-Zubehoer/Servos-Digital-Low-Voltage/SAVOEX-SH-0255MG-6V-3-9KG-0-13s-Digital-Micro-Servo/9795255
    - https://roboter-bausatz.de/media/pdf/15/f5/87/RBS10997-MG996R-Datenblatt.pdf
    - https://emerson.com/documents/automation/datenblatt-servomotoren-aventics-de-10430086.pdf
  note: Hobby servo shops label this value "Stellkraft" (in kg/cm) and use "Blockierstrom" for stall current. Industrial servo motor datasheets (Aventics) print "Stillstandsmoment", but that is the continuous torque at standstill, a different quantity from the maximum torque at zero speed. DeepL and Google both give "Blockierdrehmoment". No German product page with "Blockiermoment" found. Language doubt for the translator session.
attribute.wheel_feet:
  term: Räder an den Füßen
  status: open
  sources:
    - https://www.auto-motor-und-sport.de/verkehr/bis-zu-21-km-h-schnell-dieser-lauf-und-roll-roboter-kennt-keine-hindernisse/
  note: No established spec label found. The press describes such robots as "Hybrid aus Rad- und Laufroboter". DeepL and Google both give "Radfüße". Language doubt for the translator session.
value.reducer_type__harmonic:
  term: Wellgetriebe
  status: changed
  was: Harmonic Drive (Wellgetriebe)
  also: [Spannungswellengetriebe]
  sources:
    - https://www.kollmorgen.com/sites/default/files/2023-12/Building%20Humanoid%20Robots-%20From%20Design%20to%20Delivery_WP_Final_de-DE.pdf
    - https://www.industrial-production.de/antriebstechnik/antriebstechnik-fuer-humanoide-roboter--nabtesco-bietet-wellgetriebe-und-aktuatoren-fuer-robotergelenke.htm
    - https://harmonicdrive.de/fileadmin/user_upload/Robotik_DE_2022_final.pdf
  note: Wellgetriebe is the generic term used by Kollmorgen and Nabtesco. "Harmonic Drive" is the name and registered mark of one maker, so it is not used as the generic label. It stays as a search term on the Reducer category.
