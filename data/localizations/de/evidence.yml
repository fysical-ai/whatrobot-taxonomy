# whatrobot taxonomy — de term evidence
# Licence: CC BY 4.0. Not loaded by the taxonomy tooling; a record of where each German term was seen.
# Keys: attribute.<key>, value.<key>, category.<id>, matching attributes.yml, values.yml and categories.yml.
# status: confirmed (term seen on the sources) | changed (draft replaced on this evidence) | open (needs a decision).
# Sources are manufacturer, reseller or trade-press pages in German, read 2026-11-18. They are evidence of usage
# only: no text is copied from them and no specifications are taken from them.
# Terms without an entry have not been checked yet.
---
