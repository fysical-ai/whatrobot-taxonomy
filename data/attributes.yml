# whatrobot taxonomy — attributes
# Source of truth. Licence: CC BY 4.0 (see data/LICENSE).
# Record = Shopify attribute record + type, multi, unit, ref_target, question.
# Every enum lists its values by friendly_id and ends with <attr>__other.
# Integer ids are permanent; never reuse.
