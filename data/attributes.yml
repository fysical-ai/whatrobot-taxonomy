  description: Manufacturer-rated runtime on one charge.
  question: What is the manufacturer-rated battery runtime?
  type: number
  unit: min
  multi: false
  bases:
    - handle: rated
      description: "The maker's headline runtime in normal operation, without payload (\"up to\" figures included). A range \"1-2 h\" → record the upper end."
    - handle: loaded
      description: "Runtime with payload or under a stated working load, when no headline figure exists."
    - handle: standby
      description: "Standby / idle time."

