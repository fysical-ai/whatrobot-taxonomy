- id: 19
  name: Mass
  friendly_id: mass
  handle: mass
  description: Product mass as specified.
  question: What is the specified mass?
  type: number
  unit: kg
  multi: false
  bases:
    - handle: operating
      description: "Complete product ready to operate, with battery, without payload or accessories. Arm = manipulator only, without controller or cabinet. Never package or shipping weight."
    - handle: without-battery
      description: "Stated without battery."
    - handle: with-controller
      description: "Arm stated including its controller (only when no arm-only figure exists)."

- id: 20
  name: Payload
  friendly_id: payload
  handle: payload
  description: "Rated payload. Arm: at the wrist. Mobile robot: on the deck. End-effector: held object."
  question: What is the rated payload?
  type: number
  unit: kg
  multi: false
  bases:
    - handle: rated
      description: "Rated payload as the spec sheet states it. Arm = at the flange/wrist. Mobile manipulator = at the arm's flange. Mobile, legged or humanoid robot = carried while moving. Humanoid = with both arms together. End-effector = held object."
    - handle: max
      description: "A higher \"maximum\" figure at reduced reach, speed or posture, when no rated figure exists."
    - handle: standing
      description: "Static or standing load (legged or mobile robot not moving)."
    - handle: per-arm
      description: "One arm of a humanoid or dual-arm robot."
    - handle: towing
      description: "Towed load (AMR / tugger)."
    - handle: shear
      description: "Magnetic or vacuum grip with the load acting parallel to the gripping face (shear), when only that figure is given. The default for these grippers is a straight pull off a flat part."

- id: 21
  name: Battery runtime
  friendly_id: battery_runtime
