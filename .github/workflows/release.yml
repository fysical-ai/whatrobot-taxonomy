name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Tag must match VERSION
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || (echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" && exit 1)
      - run: whatrobot-taxonomy validate && pytest && whatrobot-taxonomy dist
      - name: Package release assets (Shopify convention — <basename>.<locale>.<format>.gz, nested paths flattened with dots)
        run: |
          mkdir -p assets
          cd dist
          for f in $(find . -type f \( -name '*.json' -o -name '*.txt' \) | sed 's#^\./##'); do
            dir=$(dirname "$f"); base=$(basename "$f"); stem="${base%.*}"; ext="${base##*.}"
            case "$dir" in
              integrations) name="integrations.${stem}.${ext}" ;;
              *)            name="${stem}.${dir}.${ext}" ;;
            esac
            gzip -c "$f" > "../assets/${name}.gz"
          done
          cd ..
          cp data/LICENSE assets/LICENSE-CC-BY-4.0.txt
          ls assets
      - uses: softprops/action-gh-release@v2
        with: {files: assets/*}
